[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaprai"
version = "0.2.0"
description = "Sharpen raw models into principled, self-governing Elyan-class agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Elyan Labs", email = "scott@elyanlabs.com"},
]
keywords = ["agent", "llm", "lifecycle", "training", "ethics", "elyan", "dpo", "qlora", "mcp", "a2a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beacon-skill>=0.1.0",
    "grazer-skill>=0.1.0",
    "click>=8.1.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "semver>=3.0.0",
]

# Heavy ML / framework dependencies are opt-in so the CLI, lifecycle, and
# Sanctuary tooling install in seconds and work on every supported Python.
[project.optional-dependencies]
training = [
    "torch>=2.4",
    "transformers>=4.56.2",
    "peft>=0.17.0",
    "trl>=1.0,<2",
    "datasets>=3.0",
    "accelerate>=1.4.0",
    "bitsandbytes>=0.45.0; sys_platform != 'darwin'",
]
embeddings = [
    "sentence-transformers>=3.0",
]
mcp = [
    "mcp>=2.0,<3",
]
a2a = [
    "a2a-sdk>=1.0",
]
crewai = [
    "crewai>=1.0; python_version < '3.14'",
]
smolagents = [
    "smolagents>=1.20",
]
all = [
    "shaprai[training,embeddings,mcp,a2a,crewai,smolagents]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.23.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "ruff>=0.3.0",
]

[project.scripts]
shaprai = "shaprai.cli:main"

[project.urls]
Homepage = "https://github.com/Scottcjn/shaprai"
Repository = "https://github.com/Scottcjn/shaprai"
Issues = "https://github.com/Scottcjn/shaprai/issues"

[tool.setuptools.packages.find]
include = ["shaprai*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"
skip = [".venv"]
skip_glob = [".venv/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"
markers = [
    "integration: integration tests requiring network access",
    "slow: slow running tests",
]
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::requests.packages.urllib3.exceptions.InsecureRequestWarning",
]
